defaults:
  - transformer_base
  - _self_

name: transformer

q_encoder:
  name: tokenise
  embedding_dim: 32

# patch_emb_dim must stay < hidden_dim for broadcast_cat

hidden_dim: 128
n_heads: 4
n_layers: 4
ffn_mult: 4
dropout: 0.0

pos_enc: learnt_2d

q_conditioning: broadcast_cat # film | broadcast_cat | token | token_seq

share_layer_weights: false

encoder:
  name: patchify
  ch: 96
  patch_size: 4
