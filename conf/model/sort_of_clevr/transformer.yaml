defaults:
  - transformer_base
  - _self_

name: transformer

q_encoder:
  name: identity

hidden_dim: 128
n_heads: 4
n_layers: 4
ffn_mult: 2
dropout: 0.0

pos_enc: learnt_2d # learnt_1d | learnt_2d

q_conditioning: token # token | broadcast_cat | film

share_layer_weights: false # false -> normal transformer, true -> looped/universal

encoder:
  name: patchify
  ch: 128
  patch_size: 5
